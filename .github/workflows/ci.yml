name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Read-only token: CI checks out and builds, and writes nothing to the repo.
# Under release.yml's workflow_call this narrows the caller's contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the bench gate compares against the last
          # release tag, and scripts/bench-paired.sh refuses a shallow clone.
          fetch-depth: 0

      - name: Install Cyrius toolchain
        # Verified install of the pinned toolchain (v1.7.1+). The script checks
        # SHA256SUMS.sig against a release key pinned in the script (stock
        # OpenSSL Ed25519), then the tarball against that SHA256SUMS, before
        # unpacking. Fail-closed. Version comes from cyrius.cyml, never YAML.
        run: bash scripts/ci-install-cyrius.sh

      - name: Sync stdlib snapshot
        # cyrius 6.0.x serves stdlib from the version-pinned snapshot;
        # `cyrius lib sync` copies it into ./lib so the `[deps] stdlib`
        # presence-check in `cyrius deps` resolves. (Pre-6.0, `cyrius
        # deps` copied stdlib itself; that job moved to `lib sync`.)
        run: cyrius lib sync

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify dep hashes
        # Skip on the first push that introduces a new dep before
        # cyrius.lock is generated and committed. Once present, enforce.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Format check
        # Use `cyrius fmt --check <file>`, which reports drift purely via its
        # exit code (0 = canonical, non-zero = drift) and never rewrites the
        # file. Do NOT diff the stdout of `cyrius fmt <file>`: through 6.5.26
        # that printed the formatted source, but since **6.5.27** `fmt` is an
        # in-place rewriter that prints nothing, so the old
        # `diff <(cyrius fmt "$f") "$f"` form compared an empty stream against
        # every file and reported drift unconditionally for all of them.
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr; do
            [ -f "$f" ] || continue
            if ! out=$(cyrius fmt --check "$f" 2>&1); then
              echo "needs fmt: $f"
              [ -n "$out" ] && printf '%s\n' "$out" | sed 's/^/    /'
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Lint
        # Auto-discover so new modules are covered without editing CI.
        # Treat any warning as a failure (fail on any cyrlint "  warn " line).
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr; do
            [ -f "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/agnostik
          echo "agnostik: $(wc -c < build/agnostik) bytes"

      - name: Type-check (CYRIUS_TYPE_CHECK=1)
        # Verifies the v1.0.2 `: Str` annotation pass doesn't drift.
        # Filters stdlib self-flags (warnings format the path as
        # `lib/<file>.cyr` — no leading slash). Routes output through
        # a tempfile because $(...) drops null bytes that show up in
        # mixed cyrius stderr streams, which made the prior shape
        # spuriously trip a bash warning. Becomes redundant if cyrius
        # ever flips CYRIUS_TYPE_CHECK default-on.
        run: |
          tmp=$(mktemp)
          CYRIUS_TYPE_CHECK=1 cyrius build src/main.cyr build/agnostik > "$tmp" 2>&1
          # `warning:lib/...` → stdlib self-flag; drop those.
          # `warning:src/...` or any other path → agnostik-side; fail.
          if grep -E "^warning:" "$tmp" | grep -vE "^warning:lib/" | head -1 | grep -q .; then
            echo "type-check: agnostik-side warnings present"
            grep -E "^warning:" "$tmp" | grep -vE "^warning:lib/"
            rm -f "$tmp"
            exit 1
          fi
          echo "type-check: no agnostik-side warnings"
          rm -f "$tmp"

      - name: Verify ELF
        # od, not xxd: Ubuntu 26.04's runner image does not include xxd.
        run: test "$(head -c 4 build/agnostik | od -An -tx1 | tr -d ' \n')" = 7f454c46

      - name: Verify API surface snapshot
        # Diffs `docs/api-surface.snapshot` against the current agnostik-
        # namespace public-fn surface (filtered via scripts/api-surface.sh
        # to drop stdlib platform peers that vary by build environment).
        # Fails on unexplained additions or removals.
        # Intentional API bumps regenerate via `scripts/api-surface.sh
        # update` and commit the new snapshot in the same PR. v1.0.5+ gate.
        run: scripts/api-surface.sh check

      - name: Verify documentation
        # Every fn in src/ has a doc comment: a `#` line directly above it,
        # which is what `cyrius doc --check` counts. One undocumented fn fails.
        # v1.6.3–v1.8.0 gated against a grandfathered baseline; v1.9.0
        # documented all of it, so the rule is now absolute.
        run: scripts/doc-debt.sh check

      - name: Verify dist bundle is in sync with src/
        run: |
          cyrius distlib
          if ! git diff --quiet dist/agnostik.cyr 2>/dev/null; then
            echo "ERROR: dist/agnostik.cyr is stale. Run 'cyrius distlib' and commit."
            git --no-pager diff dist/agnostik.cyr | head -40
            exit 1
          fi
          echo "dist bundle matches src/"

      - name: Cross-build aarch64
        # Best-effort: only when the toolchain bundle ships cycc_aarch64.
        # cyrius renamed cc5 -> cycc at 6.0.0. The cc5_* compat symlinks came
        # from its install.sh, never the release tarball this job unpacks
        # (checked 6.0.14, 6.0.26, 6.6.6), and were dropped at 6.1.1 — so the
        # old `cc5_aarch64` probe skipped this step on every 6.x pin, silently.
        # That is how agnostik's raw getrandom 318 (-ENOSYS on aarch64, F-022)
        # went unseen until 1.6.2.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            echo "::warning::cycc_aarch64 not shipped with this Cyrius toolchain — skipping"
            exit 0
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/agnostik-aarch64
          file build/agnostik-aarch64 | grep -q "aarch64" || {
            echo "ERROR: agnostik-aarch64 is not aarch64 ELF"; exit 1; }
          echo "agnostik-aarch64: $(wc -c < build/agnostik-aarch64) bytes"

      - name: Test
        run: |
          fail=0
          for t in tests/tcyr/*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name ==="
            if ! cyrius test "$t"; then
              echo "FAIL: $name"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "test failures"; exit 1; }

      - name: Allocation-failure probes
        # v1.12.3+. tests/probes/*.cyr drain the heap (or forge a size) and
        # check that agnostik fails by name: the static out-of-memory error
        # from agnostik_err_new, exit 71 with "agnostik: allocation failed"
        # from every other allocation, never a write through address 0. They
        # run under `prlimit --as` (util-linux), outside `cyrius test`, because
        # unbounded the drain would map memory until the address space ran out.
        run: bash scripts/oom-probe.sh

      - name: Test (aarch64 under qemu-user)
        # v1.7.1+. CI cross-built aarch64 but never ran it, so a result that is
        # wrong only on aarch64 (the F-022 class: a raw syscall number that is
        # -ENOSYS there) could ship behind a green build. This runs every .tcyr
        # under qemu-aarch64, which cyrius execs from /usr/bin. Not best-effort:
        # a missing emulator or cross-compiler fails the step, because a silent
        # skip is how F-022 went unseen. So does a file that prints no verdict.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user > /dev/null
          [ -x /usr/bin/qemu-aarch64 ] || { echo "ERROR: qemu-user did not provide /usr/bin/qemu-aarch64"; exit 1; }
          [ -x "$HOME/.cyrius/bin/cycc_aarch64" ] || { echo "ERROR: the toolchain ships no cycc_aarch64"; exit 1; }
          fail=0; files=0; total=0
          for t in tests/tcyr/*.tcyr; do
            [ -f "$t" ] || continue
            files=$((files + 1))
            out=$(cyrius test --aarch64 "$t" 2>&1) || { echo "$out"; echo "FAIL: $t"; fail=1; continue; }
            n=$(printf '%s\n' "$out" | grep -E '^[0-9]+ passed, 0 failed' | tail -1 | grep -oE '^[0-9]+')
            [ -n "$n" ] || { echo "$out"; echo "FAIL: $t printed no passing verdict"; fail=1; continue; }
            total=$((total + n))
          done
          echo "aarch64: $files test file(s), $total assertions"
          [ $fail -eq 0 ] && [ $files -gt 0 ]

      - name: Bench
        run: cyrius bench tests/bcyr/agnostik.bcyr

      - name: Bench gate (paired against the last release)
        # Builds the last release tag's bench on its own cyrius pin (installed
        # alongside, verified) and this tree's on its pin, runs them in 9
        # interleaved rounds on this runner, and fails a row whose median
        # paired slowdown is over 50% and 50 ns. Skip via
        # [bench-regression-ack] in the HEAD commit message for an intentional
        # trade-off. Until 1.12.1 CI ran scripts/bench-regression.sh, which
        # compares one run against history.csv rows taken on the release host:
        # a runner's CPU speed then read as regressions (and the same commit
        # passed and failed minutes apart). That script stays the local
        # release gate, on the host that records history.csv.
        run: scripts/bench-paired.sh

  security:
    name: Security Scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments via awk.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # No raw syscall at all (v1.7.1+; ADR-003). A raw number is
          # x86_64-linux numbering: aarch64 and Windows translate only some
          # numbers, and agnos numbers its own, which the compiler does not
          # diagnose. F-022 (getrandom 318) and F-023 (the /dev/urandom
          # fallback) were both raw numbers that meant something else on
          # another target. Go through the stdlib sys_* wrappers. This also
          # covers the raw execve / fork / clone this scan used to name.
          scan "raw syscall"  '\bsyscall *('
          # sys_system in src/ is a hard fail — agnostik should never spawn.
          scan "sys_system"   '\bsys_system\s*('
          # Hardcoded system paths agnostik should never read/write.
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          # Unbounded stack buffers (>= 64KB — force heap review).
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

      - name: Private helpers are namespaced
        # Consumers vendor agnostik next to other libraries in one compilation
        # unit, where a same-named fn either silently replaces another (last
        # definition wins) or, at a different arity, is a hard error. Generic
        # helper names collided: `_hex_nibble` with sigil (in 4 of 5
        # consumers), `_json_int` / `_json_str` with ai-hwaccel and itihas,
        # `_hex_byte` with bote. So every `_`-prefixed fn in a shipped module
        # is `_stik_`-prefixed. src/main.cyr is the test harness and never
        # ships in dist/agnostik.cyr. v1.7.0+ gate.
        # Since 1.12.3 it covers `#inline fn _` and top-level `var _` globals
        # too (F-037): same-named globals merge across libraries with no
        # diagnostic, so another library's `_hex_lut` turned every agnostik
        # UUID into ZZZZZZZZ-.... The three callback hand-offs allowed below
        # are documented API that legacy callbacks read by name.
        run: |
          hits=$(grep -nE '^(pub |public |#inline )?fn _' src/*.cyr | grep -v '^src/main\.cyr:' | grep -vE ':(pub |public |#inline )?fn _stik_' || true)
          ghits=$(grep -nE '^var _' src/*.cyr | grep -v '^src/main\.cyr:' | grep -vE ':var _stik_' | grep -vE ':var _(ss_put_value|textmap_extra|propagator_extra) ' || true)
          if [ -n "$hits$ghits" ]; then
            echo "FAIL: private fns or globals without the _stik_ prefix:"
            if [ -n "$hits" ]; then echo "$hits"; fi
            if [ -n "$ghits" ]; then echo "$ghits"; fi
            exit 1
          fi
          echo "ok: every private fn and global in a shipped module is _stik_-prefixed"

  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md \
                   CODE_OF_CONDUCT.md LICENSE CLAUDE.md cyrius.cyml \
                   docs/development/state.md docs/development/roadmap.md; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (cyrius.cyml pulls VERSION via \${file:VERSION})"
